<!DOCTYPE html>
<html>
<head>
    
    <title>Facebook.com</title>

    <style>

       body{
        background-color: #f0f2f5;
        font-family: Arial;
       }

       div{
        width: 515px;
        margin: 30px auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0px 3px 10px gray;
       }
       form{
        padding: 0px;
       }

       label{
        display: block;
        text-align: center;
        font-size: 20px;
       }

       input{
        height: 65px;
        width: 455px;
        border-radius: 7px;
        border: 1px solid #ddd;
        padding-left: 15px;
        font-size: 18px;
        margin-bottom: 15px;
       }

       input::placeholder{
        font-weight: normal;
        font-size: 18px;
       }
       #login{
        width: 475px;
        height: 67px;
        border-radius: 7px;
        border: 1px;
        background-color: #1877F2;
        color: white;
        font-size: 25px;
       }

       #forgot{
        width: 475px;
        height: 40px;
        border: 0px;
        background-color: white;
        color: #1877F2;
        font-size: 18px;
       }

       #forgot:hover{
        background-color: #EEEEEE;
       }

       #newacc{
        width: 475px;
        height: 50px;
        border-radius: 7px;
        border: 1px solid #1877F2;
        background-color: white;
        color: #1877F2;
        font-size: 18px;
       }

       h2{
        font-family: Arial, sans-serif;
        text-align: center;
        font-weight: 400;
       }

    </style>
</head>

<body>
    <div>

        <form>

            <br>

            <label><b></b>Log in to Facebook</b></label>

            <br><br>

            <input type="text" placeholder="Email or phone number" required>

    

            <input type="password" placeholder="Password">

            <br><br>

            <button type="submit" id="login">
                <b>Log in</b>
            </button>

            <br><br>

            <button type="submit" id="forgot">
                Forgot your password?
            </button>

            <br><br><br>

            <button type="submit" id="newacc">
                <b>Create New Account</b>
            </button>

            <h2><b>Meta</b></h2>

        </form>

    </div>

</body>
</html>
